<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>התשלום נכשל</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .icon-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #fee2e2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .xmark { font-size: 40px; color: #ef4444; font-weight: bold; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { font-size: 15px; color: #64748b; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle"><span class="xmark">✕</span></div>
    <h1>התשלום לא הושלם</h1>
    <p>אפשר לסגור את החלון הזה ולבקש מהמוכר/ת קוד תשלום חדש.</p>
  </div>
</body>
</html>
